# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - SLOFoods

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # run the backend tests from the root, since jest is installed there
      - name: npm install and test
        run: |
          npm ci
          npm test -w express-backend

      # install only the backend's packages inside its own folder, so the deployed app has them
      - name: Install backend packages for deployment
        run: npm install --workspaces=false --omit=dev
        working-directory: packages/express-backend

      # deploy only the backend folder, which has "start": "node backend.js"
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: packages/express-backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_27594B823E534B168FB96EE554873C35 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7FD0C80402B5429AB825E3A44AB8DBFB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9D1D1B57DBBB48B9A9212834CD15DAD5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SLOFoods'
          slot-name: 'Production'
          package: .
          